<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mes dépôts GitHub</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
    line-height: 1.5;
  }
  h1 {
    text-align: center;
    margin-bottom: 0.5rem;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 2.5rem;
  }
  .category {
    max-width: 900px;
    margin: 0 auto 2.5rem;
  }
  .category h2 {
    font-size: 1.25rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
    margin-bottom: 1rem;
    color: var(--accent);
  }
  .repos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }
  .repo {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s, border-color 0.15s;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .repo:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .repo .name {
    font-weight: 600;
    color: var(--accent);
    font-size: 1.05rem;
  }
  .repo .desc {
    color: var(--muted);
    font-size: 0.9rem;
    flex: 1;
  }
  .repo .lang {
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .repo .lang::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }
</style>
</head>
<body>

<h1>📦 Mes dépôts GitHub</h1>
<p class="subtitle">Classés par catégorie</p>

<div id="content"></div>

<script>
  // ================================================================
  // ✏️ CONFIGURATION : ajoute / modifie tes dépôts ici.
  // Chaque dépôt : { name, url, description, language }
  // ================================================================
  const REPOS = {
    "🌐 Sites Web": [
      {
        name: "mon-portfolio",
        url: "https://github.com/ton-user/mon-portfolio",
        description: "Portfolio personnel en HTML/CSS/JS.",
        language: "JavaScript"
      },
      {
        name: "blog-perso",
        url: "https://github.com/ton-user/blog-perso",
        description: "Blog statique généré avec Hugo.",
        language: "HTML"
      }
    ],
    "🛠️ Outils & Scripts": [
      {
        name: "auto-backup",
        url: "https://github.com/ton-user/auto-backup",
        description: "Script Bash de sauvegarde automatique.",
        language: "Shell"
      },
      {
        name: "pdf-merger",
        url: "https://github.com/ton-user/pdf-merger",
        description: "Fusion de PDF en Python.",
        language: "Python"
      }
    ],
    "🎮 Projets perso": [
      {
        name: "jeu-snake",
        url: "https://github.com/ton-user/jeu-snake",
        description: "Un petit jeu Snake en JavaScript.",
        language: "JavaScript"
      }
    ]
  };
  // ================================================================

  const content = document.getElementById("content");

  for (const [category, repos] of Object.entries(REPOS)) {
    const section = document.createElement("section");
    section.className = "category";

    const h2 = document.createElement("h2");
    h2.textContent = category;
    section.appendChild(h2);

    const grid = document.createElement("div");
    grid.className = "repos";

    repos.forEach(repo => {
      const a = document.createElement("a");
      a.className = "repo";
      a.href = repo.url;
      a.target = "_blank";        // ouvre dans un nouvel onglet
      a.rel = "noopener noreferrer";

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = repo.name;
      a.appendChild(name);

      if (repo.description) {
        const desc = document.createElement("div");
        desc.className = "desc";
        desc.textContent = repo.description;
        a.appendChild(desc);
      }

      if (repo.language) {
        const lang = document.createElement("div");
        lang.className = "lang";
        lang.textContent = repo.language;
        a.appendChild(lang);
      }

      grid.appendChild(a);
    });

    section.appendChild(grid);
    content.appendChild(section);
  }
</script>

</body>
</html>
