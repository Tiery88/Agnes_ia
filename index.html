<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes créations — Tiery88</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1rem;
    line-height: 1.5;
  }
  h1 { text-align: center; margin-bottom: 0.5rem; }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 2.5rem; }
  .category { max-width: 900px; margin: 0 auto 2.5rem; }
  .category h2 {
    font-size: 1.25rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
    margin-bottom: 1rem;
    color: var(--accent);
  }
  .repos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }
  .repo {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s, border-color 0.15s;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .repo:hover { transform: translateY(-3px); border-color: var(--accent); }
  .repo .name { font-weight: 600; color: var(--accent); font-size: 1.05rem; }
  .repo .desc { color: var(--muted); font-size: 0.9rem; flex: 1; }
  .repo .lang {
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .repo .lang::before {
    content: "";
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }
  .loading, .error {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
  }
  .error { color: #f85149; }
</style>
</head>
<body>

<h1>🎬 Mes créations</h1>
<p class="subtitle">Liste mise à jour automatiquement</p>

<div id="content">
  <div class="loading">⏳ Chargement…</div>
</div>

<script>
  // ================================================================
  // 🔧 CONFIGURATION
  // ================================================================
  const GITHUB_USER = "Tiery88";       // ton nom d'utilisateur
  const GITHUB_REPO = "Agnes_ia";      // nom de ton dépôt
  const GITHUB_BRANCH = "main";        // branche

  // 🏷️ Catégories personnalisées : mot-clé dans le nom → { label, emoji }
  // Le mot-clé est cherché (insensible à la casse) au début du nom du fichier.
  // Si aucun ne correspond, la catégorie "Autres" est utilisée.
  const CATEGORIES = [
    { keyword: "agnes",     label: "Agnes",       emoji: "👩" },
    { keyword: "clip",      label: "Clips",       emoji: "🎵" },
    { keyword: "livraison", label: "Livraisons",  emoji: "📦" },
    { keyword: "yoga",      label: "Yoga",        emoji: "🧘" },
    { keyword: "image",     label: "Images",      emoji: "🖼️" }
  ];
  const DEFAULT_CATEGORY = { label: "Autres", emoji: "📁" };

  // ================================================================

  const content = document.getElementById("content");

  // Échappe le HTML pour éviter les injections
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  // Enlève l'extension .html et formate le nom pour l'affichage
  function prettyName(filename) {
    let name = filename.replace(/\.html?$/i, "").replace(/[-_]/g, " ");
    // Met en majuscule la première lettre de chaque mot
    return name.replace(/\b\w/g, c => c.toUpperCase());
  }

  // Trouve la catégorie d'un fichier
  function findCategory(filename) {
    const lower = filename.toLowerCase();
    for (const cat of CATEGORIES) {
      if (lower.startsWith(cat.keyword)) return cat;
    }
    return DEFAULT_CATEGORY;
  }

  // Charge la liste des fichiers via l'API GitHub
  async function loadRepos() {
    const api = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;
    const res = await fetch(api);
    if (!res.ok) throw new Error(`Erreur API GitHub (${res.status})`);
    const files = await res.json();

    // Filtre : uniquement les .html / .htm, à la racine, sauf index.html
    const htmlFiles = files.filter(f =>
      f.type === "file" &&
      /\.html?$/i.test(f.name) &&
      f.name.toLowerCase() !== "index.html"
    );

    if (htmlFiles.length === 0) {
      content.innerHTML = '<div class="loading">Aucun fichier HTML pour le moment.</div>';
      return;
    }

    // Regroupe par catégorie
    const groups = {};
    htmlFiles.forEach(f => {
      const cat = findCategory(f.name);
      const key = cat.emoji + " " + cat.label;
      if (!groups[key]) groups[key] = [];
      groups[key].push(f);
    });

    // Trie les catégories (ordre défini ci-dessus, puis Autres à la fin)
    const order = CATEGORIES.map(c => c.emoji + " " + c.label);
    const sortedKeys = Object.keys(groups).sort((a, b) => {
      const ia = order.indexOf(a); const ib = order.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });

    // Construit le HTML
    content.innerHTML = "";
    sortedKeys.forEach(key => {
      const section = document.createElement("section");
      section.className = "category";

      const h2 = document.createElement("h2");
      h2.textContent = key;
      section.appendChild(h2);

      const grid = document.createElement("div");
      grid.className = "repos";

      // Trie les fichiers par nom dans la catégorie
      groups[key].sort((a, b) => a.name.localeCompare(b.name));

      groups[key].forEach(f => {
        const a = document.createElement("a");
        a.className = "repo";
        a.href = f.name;              // lien relatif → même dépôt
        a.target = "_blank";          // 👈 nouvel onglet
        a.rel = "noopener noreferrer";

        const nameEl = document.createElement("div");
        nameEl.className = "name";
        nameEl.textContent = prettyName(f.name);
        a.appendChild(nameEl);

        const descEl = document.createElement("div");
        descEl.className = "desc";
        descEl.textContent = f.name;
        a.appendChild(descEl);

        const langEl = document.createElement("div");
        langEl.className = "lang";
        langEl.textContent = "HTML";
        a.appendChild(langEl);

        grid.appendChild(a);
      });

      section.appendChild(grid);
      content.appendChild(section);
    });
  }

  loadRepos().catch(err => {
    content.innerHTML = `<div class="error">❌ ${escapeHtml(err.message)}</div>`;
  });
</script>

</body>
</html>
